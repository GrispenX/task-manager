name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    
    - uses: actions/checkout@v4
    
    - name: install libs
      run: sudo apt undate & sudo apt install libgtest-dev libgmock-dev nlohmann-json3-dev
      
    - name: configure cmake
      run: cmake -S . -B build

    - name: build
      run: make -C build
      
    - name: run tests
      run: ./build/test/TaskManagerTest
